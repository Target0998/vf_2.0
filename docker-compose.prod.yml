# Staging / production override – run on the server:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Caddy terminates HTTPS on 80/443 and proxies to Ghost and the donate API.
# Nothing else is published to the host; Mailpit is not started.
# Needs Docker Compose ≥ 2.24 (for !reset).

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [ghost, donate-api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  ghost:
    ports: !reset []
    environment:
      # production = templates are cached; restart Ghost after pulling theme changes
      NODE_ENV: production
      url: ${GHOST_URL:?set GHOST_URL in .env}
      # transactional mail (login links, member sign-up) via Mailgun SMTP.
      # Newsletters use the Mailgun API key, set in Ghost Admin → Settings → Newsletters.
      mail__from: ${MAIL_FROM:-Világítani Fogok <noreply@vilagitanifogok.hu>}
      mail__options__host: ${MAILGUN_SMTP_HOST:-smtp.eu.mailgun.org}
      mail__options__port: 587
      mail__options__secure: "false"
      mail__options__auth__user: ${MAILGUN_SMTP_USER:?set MAILGUN_SMTP_USER in .env}
      mail__options__auth__pass: ${MAILGUN_SMTP_PASSWORD:?set MAILGUN_SMTP_PASSWORD in .env}
      security__staffDeviceVerification: "true"
      # web analytics (Tinybird). Empty tokens = analytics off; the tracker goes through traffic-analytics (Caddy route)
      tinybird__tracker__endpoint: ${GHOST_URL}/.ghost/analytics/api/v1/page_hit
      tinybird__tracker__datasource: analytics_events
      tinybird__adminToken: ${TINYBIRD_ADMIN_TOKEN:-}
      tinybird__workspaceId: ${TINYBIRD_WORKSPACE_ID:-}
      tinybird__stats__endpoint: ${TINYBIRD_API_URL:-https://api.tinybird.co}

  donate-api:
    ports: !reset []
    command: ["node", "server.js"]
    environment:
      SITE_URL: ${GHOST_URL}
      ALLOWED_ORIGINS: ${GHOST_URL}

  db:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}

  mailpit:
    profiles: [local-only]

  # ── Web analytics (profile "analytics", from TryGhost/ghost-docker) ─────────────────────────
  # One-time setup: docs/PROJECT.md → Web analytics. Turn on with COMPOSE_PROFILES=analytics in .env.
  # traffic-analytics receives page hits at /.ghost/analytics/ (Caddy), replaces the IP with a daily
  # salted session id and forwards the event to Tinybird.
  traffic-analytics:
    image: ghost/traffic-analytics:1.0.451@sha256:ed36fcd315cbc440b4dd906bc4227a348b3fb5ad973017ea28a4ff1ebed81c15
    restart: unless-stopped
    expose: ["3000"]
    volumes:
      - traffic_analytics_data:/data
    environment:
      NODE_ENV: production
      PROXY_TARGET: ${TINYBIRD_API_URL:-https://api.tinybird.co}/v0/events
      SALT_STORE_TYPE: file
      SALT_STORE_FILE_PATH: /data/salts.json
      TINYBIRD_TRACKER_TOKEN: ${TINYBIRD_TRACKER_TOKEN:-}
      LOG_LEVEL: info
    profiles: [analytics]

  tinybird-login:
    build: ./tinybird
    working_dir: /home/tinybird
    command: /usr/local/bin/tinybird-login
    volumes:
      - tinybird_home:/home/tinybird
      - tinybird_files:/data/tinybird
    profiles: [analytics]
    restart: "no"

  tinybird-sync:   # copies Ghost's Tinybird schema (datasources, pipes) into a shared volume
    image: ghost:6-alpine
    entrypoint: []
    command: >
      sh -c "rm -rf /data/tinybird/* && cp -rf /var/lib/ghost/current/core/server/data/tinybird/* /data/tinybird/ && echo 'Tinybird files synced into shared volume.'"
    volumes:
      - tinybird_files:/data/tinybird
    profiles: [analytics]
    restart: "no"

  tinybird-deploy:
    build: ./tinybird
    working_dir: /data/tinybird
    command: sh -c "tb-wrapper --cloud deploy"
    volumes:
      - tinybird_home:/home/tinybird
      - tinybird_files:/data/tinybird
    profiles: [analytics]
    restart: "no"

volumes:
  caddy_data:
  caddy_config:
  traffic_analytics_data:
  tinybird_home:
  tinybird_files:
