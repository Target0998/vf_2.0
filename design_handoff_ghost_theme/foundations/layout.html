<!doctype html><html lang="hu"><head><meta charset="utf-8"><title>Térköz</title><link rel="stylesheet" href="../styles.css"><style>.d{padding:32px;display:flex;flex-direction:column;gap:24px}.h{font:700 12px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--color-muted)}.sp{display:flex;align-items:flex-end;gap:14px}.sp div{background:var(--color-primary);border-radius:3px}.sp span{display:block;font:600 12px var(--font-body);color:var(--color-muted);margin-top:6px;text-align:center}.rad{display:flex;gap:14px}.rad div{width:96px;height:72px;background:var(--color-mint);display:flex;align-items:flex-end;padding:8px;font:600 12px var(--font-body)}.sh{display:flex;gap:20px}.sh div{width:150px;height:70px;background:#fff;border-radius:var(--radius-lg);display:grid;place-items:center;font:600 13px var(--font-body)}</style></head><body><div class="d">
<div class="h">Térköz</div><div class="sp"><div><div style="width:8px;height:8px"></div><span>8</span></div><div><div style="width:16px;height:16px"></div><span>16</span></div><div><div style="width:24px;height:24px"></div><span>24</span></div><div><div style="width:32px;height:32px"></div><span>32</span></div><div><div style="width:48px;height:48px"></div><span>48</span></div><div><div style="width:64px;height:64px"></div><span>64 margó</span></div><div><div style="width:88px;height:88px"></div><span>88 szekció</span></div></div>
<div class="h">Lekerekítés</div><div class="rad"><div style="border-radius:var(--radius-md)">md 14</div><div style="border-radius:var(--radius-lg)">lg 22</div><div style="border-radius:var(--radius-xl)">xl 28</div><div style="border-radius:var(--radius-pill);width:140px">pill</div></div>
<div class="h">Árnyék</div><div class="sh" style="background:var(--color-sand);padding:24px;border-radius:var(--radius-xl)"><div style="box-shadow:var(--shadow-sm)">sm</div><div style="box-shadow:var(--shadow-md)">md · doboz</div><div style="box-shadow:var(--shadow-lg)">lg · sötéten</div></div>
</div></body></html>
